<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction & Service Dashboard</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #eff6ff;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --pending: #d97706;
            --pending-bg: #fef3c7;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
        }

        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header-card {
            background-color: var(--card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 16px;
            border-left: 6px solid var(--primary);
        }

        h2 {
            margin: 0 0 16px 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .service-selector {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background-color: #fff;
            cursor: pointer;
            font-weight: 500;
        }

        .service-selector:focus {
            outline: none;
            border-color: var(--primary);
        }

        .active-banner {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 16px;
            border: 1px solid #bfdbfe;
            letter-spacing: 0.5px;
        }

        .form-card {
            background-color: var(--card);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #475569;
        }

        input, select, textarea {
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fff;
            color: var(--text);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

        .badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .badge-success { background-color: var(--success-bg); color: var(--success); }
        .badge-pending { background-color: var(--pending-bg); color: var(--pending); }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 24px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="dashboard-container">

    <!-- Service Selection Box -->
    <div class="header-card">
        <h2>सर्विस का चुनाव करें (Select Service)</h2>
        <select id="serviceSelector" class="service-selector" onchange="togglePanels()">
            <option value="aepsEnquiry">AePS Enquiry</option>
            <option value="aepsWithdrawal">AePS Withdrawal</option>
            <option value="deposit">Deposit</option>
            <option value="upiQr">UPI / QR</option>
            <option value="moneyTransfer">Money Transfer</option>
            <option value="laundry">Laundry Payment</option>
        </select>
    </div>

    <!-- Live Active Title Display -->
    <div id="activeTitle" class="active-banner">
        ACTIVE SERVICE: AEPS ENQUIRY
    </div>

    <!-- Main Dynamic Form -->
    <div class="form-card">
        <form onsubmit="event.preventDefault(); alert('डाटा सफलतापूर्वक दर्ज हो गया!');">
            
            <!-- 1. AEPS ENQUIRY PANEL -->
            <div id="panel-aepsEnquiry" class="panel active">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Agent ID Selection (10 Saved IDs)</label>
                        <select class="agent-dropdown">
                            <!-- 10 Unique Managed Agent IDs -->
                            <option value="AG-01">AG001 (Main Counter)</option>
                            <option value="AG-02">AG002 (Branch Office)</option>
                            <option value="AG-03">AG003 (Desk A)</option>
                            <option value="AG-04">AG004 (Desk B)</option>
                            <option value="AG-05">AG005 (Field Team 1)</option>
                            <option value="AG-06">AG006 (Field Team 2)</option>
                            <option value="AG-07">AG007 (Support Desk)</option>
                            <option value="AG-08">AG008 (Retail Hub)</option>
                            <option value="AG-09">AG009 (Express Counter)</option>
                            <option value="AG-10">AG100 (Admin BackOffice)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Bank Name</label>
                        <input type="text" placeholder="बैंक का नाम चुनें या लिखें">
                    </div>
                    <div class="form-group">
                        <label>Aadhaar / Card (Last 4 Digits)</label>
                        <input type="text" maxlength="4" placeholder="केवल आखरी 4 अंक">
                    </div>
                    <div class="form-group full-width">
                        <label>Enquiry Balance</label>
                        <input type="number" placeholder="₹ 0.00">
                    </div>
                </div>
            </div>

            <!-- 2. AEPS WITHDRAWAL PANEL -->
            <div id="panel-aepsWithdrawal" class="panel">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Agent ID Selection</label>
                        <select class="agent-dropdown-copy"></select>
                    </div>
                    <div class="form-group">
                        <label>Bank Name</label>
                        <input type="text" placeholder="बैंक का नाम">
                    </div>
                    <div class="form-group">
                        <label>Aadhaar / Card (Last 4 Digits)</label>
                        <input type="text" maxlength="4" placeholder="X X X X">
                    </div>
                    <div class="form-group">
                        <label>Enquiry Balance (पहले कितना था)</label>
                        <input type="number" placeholder="₹ 0.00">
                    </div>
                    <div class="form-group">
                        <label>Withdrawal Amount (कितना निकाला)</label>
                        <input type="number" placeholder="₹ 0.00">
                    </div>
                    <div class="form-group">
                        <label>Charge / कटौती Amount</label>
                        <input type="number" placeholder="₹ 0.00">
                    </div>
                    <div class="form-group">
                        <label>Remaining Balance (बचा हुआ बैलेंस)</label>
                        <input type="number" placeholder="₹ 0.00">
                    </div>
                    
                    <div class="form-group full-width">
                        <label>Transaction Status</label>
                        <div class="status-container">
                            <select id="statusSelect" onchange="changeStatusBadge(this.value)" style="width: 140px;">
                                <option value="success">Success</option>
                                <option value="pending">Pending</option>
                            </select>
                            <span id="liveBadge" class="badge badge-success">SUCCESS</span>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label>Remarks</label>
                        <textarea rows="2" placeholder="ट्रांजैक्शन की टिप्पणी लिखें..."></textarea>
                    </div>
                </div>
            </div>

            <!-- 3. DEPOSIT PANEL -->
            <div id="panel-deposit" class="panel">
                <div class="form-grid">
                    <div class="form-group full-width">
