<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahakal Online Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #ff9933, #ffffff, #138808); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #d35400; margin-bottom: 10px; font-size: 24px; }
        p { color: #7f8c8d; margin-bottom: 20px; font-size: 14px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #34495e; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; font-size: 14px; }
        input:focus { border-color: #e67e22; outline: none; }
        .btn { width: 100%; padding: 12px; background: #e67e22; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background: #d35400; }
        .toggle-text { margin-top: 15px; font-size: 13px; color: #2c3e50; }
        .toggle-text span { color: #e67e22; cursor: pointer; font-weight: bold; }
        .dashboard { display: none; }
        .service-card { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 15px; margin: 10px 0; border-radius: 8px; text-align: left; text-decoration: none; color: #333; display: block; font-weight: bold; transition: 0.2s; }
        .service-card:hover { background: #fff3e6; border-color: #ff9933; }
    </style>
</head>
<body>

<div class="container" id="auth-box">
    <h1 id="form-title">जय महाकाल ऑनलाइन सेंटर</h1>
    <p id="form-desc">नया अकाउंट बनाने के लिए जानकारी भरें</p>
    
    <div class="input-group" id="name-group">
        <label>आपका नाम</label>
        <input type="text" id="username" placeholder="पूरा नाम दर्ज करें">
    </div>
    <div class="input-group">
        <label>मोबाइल नंबर / ईमेल</label>
        <input type="text" id="contact" placeholder="9876xxxxxx">
    </div>
    <div class="input-group">
        <label>पासवर्ड</label>
        <input type="password" id="password" placeholder="******">
    </div>
    
    <button class="btn" id="submit-btn" onclick="handleSubmit()">Sign Up (रजिस्टर करें)</button>
    
    <p class="toggle-text" id="toggle-msg">पहले से अकाउंट है? <span onclick="toggleForm()">Login करें</span></p>
</div>

<!-- सफलता के बाद दिखने वाला डैशबोर्ड -->
<div class="container dashboard" id="dashboard-box">
    <h1>आपका स्वागत है!</h1>
    <p>महाकाल ऑनलाइन सेंटर की लाइव सेवाएं नीचे दी गई हैं:</p>
    
    <a href="https://mp.gov.in" target="_blank" class="service-card">🕉️ महाकाल मंदिर आधिकारिक बुकिंग</a>
    <a href="https://mponline.gov.in" target="_blank" class="service-card">💻 MP Online सरकारी फॉर्म पोर्टल्स</a>
    <a href="https://youtube.com" target="_blank" class="service-card">📺 महाकाल लाइव आरती (YouTube)</a>
    
    <button class="btn" style="background: #7f8c8d;" onclick="logout()">Log Out (बाहर निकलें)</button>
</div>

<script>
    let isSignUp = true;

    function toggleForm() {
        isSignUp = !isSignUp;
        const formTitle = document.getElementById('form-title');
        const formDesc = document.getElementById('form-desc');
        const nameGroup = document.getElementById('name-group');
        const submitBtn = document.getElementById('submit-btn');
        const toggleMsg = document.getElementById('toggle-msg');

        if (isSignUp) {
            formTitle.innerText = "जय महाकाल ऑनलाइन सेंटर";
            formDesc.innerText = "नया अकाउंट बनाने के लिए जानकारी भरें";
            nameGroup.style.display = "block";
            submitBtn.innerText = "Sign Up (रजिस्टर करें)";
            toggleMsg.innerHTML = 'पहले से अकाउंट है? <span onclick="toggleForm()">Login करें</span>';
        } else {
            formTitle.innerText = "लॉगिन करें";
            formDesc.innerText = "अपने अकाउंट में प्रवेश करें";
            nameGroup.style.display = "none";
            submitBtn.innerText = "Login (प्रवेश करें)";
            toggleMsg.innerHTML = 'नया अकाउंट बनाना है? <span onclick="toggleForm()">Sign Up करें</span>';
        }
    }

    function handleSubmit() {
        const contact = document.getElementById('contact').value;
        const password = document.getElementById('password').value;

        if (!contact || !password) {
            alert("कृपया सभी जानकारी सही से भरें!");
            return;
        }

        // नकली डेटाबेस एंट्री और डायरेक्ट लॉगिन
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('dashboard-box').style.display = 'block';
    }

    function logout() {
        document.getElementById('dashboard-box').style.display = 'none';
        document.getElementById('auth-box').style.display = 'block';
        document.getElementById('contact').value = '';
        document.getElementById('password').value = '';
        if(document.getElementById('username')) document.getElementById('username').value = '';
    }
</script>

</body>
</html>
